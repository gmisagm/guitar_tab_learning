<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Fretboard Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 30px 20px;
    min-height: 100vh;
  }

  h1   { color: #d4a843; font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 32px; }

  /* ── Scroll + perspective wrapper ─────────────────────── */
  #neck-wrapper {
    overflow-x: auto;
    padding: 20px 0 30px;
  }

  #neck-perspective {
    display: inline-block;
    perspective: 2400px;
    perspective-origin: 100% 50%;
  }

  #neck-body {
    display: flex;
    align-items: stretch;
    transform: rotateY(17deg);
    transform-origin: right center;
    filter: drop-shadow(-16px 10px 28px rgba(0,0,0,0.85));
  }

  /* ── Headstock placeholder (SVG injected by JS) ────────── */
  #headstock { flex-shrink: 0; line-height: 0; }

  /* ── Fretboard ─────────────────────────────────────────── */
  #fretboard {
    display: inline-block;
    background: linear-gradient(180deg, #3d1f00 0%, #2a1500 100%);
    border-top: 8px solid #7a6040;
    border-bottom: 8px solid #7a6040;
    border-radius: 0 6px 6px 0;
    padding: 6px 0;
    user-select: none;
    flex-shrink: 0;
  }

  /* ── Header row (fret numbers) ─────────────────────────── */
  .header-row {
    display: flex;
    height: 20px;       /* explicit — must match JS HEADER_H */
  }

  .col-open {
    width: 52px; flex-shrink: 0;
    text-align: center; font-size: 10px; color: #666;
  }
  .col-fret {
    width: 44px; flex-shrink: 0;
    text-align: center; font-size: 10px; color: #666;
  }

  /* ── String rows ───────────────────────────────────────── */
  .string-row {
    display: flex;
    align-items: center;
    height: 46px;       /* explicit — must match JS ROW_H */
    position: relative;
  }

  /* Horizontal string line */
  .string-row::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%; transform: translateY(-50%);
    background: var(--str-color, #b8b8b8);
    height: var(--str-px, 1px);
    pointer-events: none;
    z-index: 1;
  }

  /* ── Open-string cell (left of nut) ────────────────────── */
  .open-cell {
    width: 52px; flex-shrink: 0;
    height: 46px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; z-index: 3;
    border-right: 6px solid #e0cfa0;   /* nut */
  }
  .open-cell:hover { background: rgba(212,168,67,0.13); }

  /* ── Fretted cell ──────────────────────────────────────── */
  .fret-cell {
    width: 44px; flex-shrink: 0;
    height: 46px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; z-index: 3;
    border-right: 3px solid #a0a0a0;
    transition: background 0.1s;
  }
  .fret-cell:hover { background: rgba(212,168,67,0.13); }

  /* ── Note bubble ───────────────────────────────────────── */
  .note-bubble {
    position: relative; z-index: 4;
    width: 36px; height: 36px; border-radius: 50%;
    background: #d4a843; color: #1a1210;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: bold; line-height: 1.15; text-align: center;
    opacity: 0; transform: scale(0.4);
    transition: opacity 0.18s ease, transform 0.18s ease;
    pointer-events: none;
  }
  .note-bubble .sharp   { font-size: 11px; }
  .note-bubble .flat    { font-size: 10px; color: #4a2e00; }
  .note-bubble .natural { font-size: 13px; }
  .note-bubble.shown    { opacity: 1; transform: scale(1); }

  /* ── Marker dot row ────────────────────────────────────── */
  .marker-row {
    display: flex;
    height: 18px;       /* explicit — JS MARKER_H = 18 + 2 margin */
    margin-top: 2px;
  }
  .marker-spacer { width: 52px; flex-shrink: 0; }
  .marker-cell   { width: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 3px; }
  .dot           { width: 7px; height: 7px; border-radius: 50%; background: #d4a843; opacity: 0.6; }

  /* ── Controls ──────────────────────────────────────────── */
  .controls { margin-top: 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { background: #d4a843; color: #1a1210; border: none; padding: 7px 16px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; transition: background 0.15s; }
  button:hover { background: #e8c050; }
  .tally { color: #888; font-size: 13px; }
  .tally span { color: #d4a843; font-weight: bold; }
</style>
</head>
<body>

<h1>Guitar Fretboard Quiz</h1>
<p class="sub">Click any position to reveal its note. Click again to hide.</p>

<div id="neck-wrapper">
  <div id="neck-perspective">
    <div id="neck-body">
      <div id="headstock"></div>
      <div id="fretboard"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="btn-reset">Reset All</button>
  <button id="btn-showall">Show All</button>
  <div class="tally">Revealed: <span id="tally-count">0</span> / <span id="tally-total">0</span></div>
</div>

<script>
  // ── Chromatic scale (C = 0) ─────────────────────────────
  const CHROMATIC = [
    { sharp: 'C',  flat: 'C'  },
    { sharp: 'C#', flat: 'D♭' },
    { sharp: 'D',  flat: 'D'  },
    { sharp: 'D#', flat: 'E♭' },
    { sharp: 'E',  flat: 'E'  },
    { sharp: 'F',  flat: 'F'  },
    { sharp: 'F#', flat: 'G♭' },
    { sharp: 'G',  flat: 'G'  },
    { sharp: 'G#', flat: 'A♭' },
    { sharp: 'A',  flat: 'A'  },
    { sharp: 'A#', flat: 'B♭' },
    { sharp: 'B',  flat: 'B'  },
  ];

  // High e → low E  (top → bottom = standard tab layout)
  const STRINGS = [
    { label: 'e', openIdx: 4,  px: 0.7, color: '#d4d4d4', openHz: 329.63 },  // plain
    { label: 'B', openIdx: 11, px: 1.1, color: '#c8c8c8', openHz: 246.94 },  // plain
    { label: 'G', openIdx: 7,  px: 1.4, color: '#bcbcbc', openHz: 196.00 },  // plain
    { label: 'D', openIdx: 2,  px: 2.0, color: '#c9a94e', openHz: 146.83 },  // wound
    { label: 'A', openIdx: 9,  px: 2.5, color: '#c09840', openHz: 110.00 },  // wound
    { label: 'E', openIdx: 4,  px: 3.2, color: '#b08830', openHz:  82.41 },  // wound
  ];

  const NUM_FRETS   = 24;
  const SINGLE_DOTS = new Set([3, 5, 7, 9, 15, 17, 19, 21]);
  const DOUBLE_DOTS = new Set([12, 24]);

  // Layout constants — must match CSS values exactly
  const BORDER   = 8;   // #fretboard border-top / border-bottom
  const PADDING  = 6;   // #fretboard padding-top / padding-bottom
  const HEADER_H = 20;  // .header-row height
  const ROW_H    = 46;  // .string-row height
  const MARKER_H = 20;  // .marker-row height + margin-top

  // Total SVG height that matches the rendered fretboard height
  const SVG_H = BORDER + PADDING + HEADER_H + STRINGS.length * ROW_H + MARKER_H + PADDING + BORDER;
  // = 8 + 6 + 20 + 276 + 20 + 6 + 8 = 344 px

  // Y-centre of string row i within the SVG coordinate space
  const pegY = i => BORDER + PADDING + HEADER_H + i * ROW_H + ROW_H / 2;

  // ── Helpers ─────────────────────────────────────────────
  function el(tag, cls)       { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function elText(tag, cls, t){ const e = el(tag, cls); e.textContent = t; return e; }
  function svgEl(tag, attrs)  {
    const NS = 'http://www.w3.org/2000/svg';
    const e  = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }

  // ── Note helpers ─────────────────────────────────────────
  function getNote(si, fret) {
    return CHROMATIC[(STRINGS[si].openIdx + fret) % 12];
  }

  function makeBubble(si, fret) {
    const { sharp, flat } = getNote(si, fret);
    const b = el('div', 'note-bubble');
    if (sharp === flat) {
      b.innerHTML = `<span class="natural">${sharp}</span>`;
    } else {
      b.innerHTML = `<span class="sharp">${sharp}</span><span class="flat">${flat}</span>`;
    }
    return b;
  }

  function makeCell(si, fret, isOpen) {
    const cell   = el('div', isOpen ? 'open-cell' : 'fret-cell');
    const bubble = makeBubble(si, fret);
    cell.appendChild(bubble);
    const freq = STRINGS[si].openHz * Math.pow(2, fret / 12);
    cell.addEventListener('click', () => { bubble.classList.toggle('shown'); updateTally(); playNote(freq); });
    return cell;
  }

  function updateTally() {
    document.getElementById('tally-count').textContent =
      document.querySelectorAll('.note-bubble.shown').length;
  }

  // ── Audio (Karplus-Strong plucked string) ────────────────
  // The algorithm: seed a circular buffer with noise, then on each sample
  // output the current value and replace it with the average of adjacent
  // samples × a decay factor. The buffer length = sampleRate / frequency,
  // so the feedback resonates at exactly the right pitch.
  const WORKLET_CODE = `
class PluckProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buf = null;
    this.pos = 0;
    this.port.onmessage = ({ data }) => {
      const len = Math.round(sampleRate / data.freq);
      this.buf = new Float32Array(len);
      for (let i = 0; i < len; i++) this.buf[i] = Math.random() * 2 - 1;
      this.pos = 0;
    };
  }
  process(_, outputs) {
    const ch = outputs[0][0];
    if (!this.buf) return true;
    const buf = this.buf, len = buf.length;
    for (let i = 0; i < ch.length; i++) {
      ch[i] = buf[this.pos];
      const next = (this.pos + 1) % len;
      buf[this.pos] = (buf[this.pos] + buf[next]) * 0.498; // 0.498 ≈ 2-3 s decay
      this.pos = next;
    }
    return true;
  }
}
registerProcessor('pluck', PluckProcessor);
`;

  let audioCtx    = null;
  let workletReady = null; // cached Promise

  async function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (!workletReady) {
      const blob = new Blob([WORKLET_CODE], { type: 'application/javascript' });
      const url  = URL.createObjectURL(blob);
      workletReady = audioCtx.audioWorklet.addModule(url)
                              .then(() => URL.revokeObjectURL(url));
    }
    await workletReady;
    if (audioCtx.state === 'suspended') await audioCtx.resume();
  }

  async function playNote(freq) {
    try {
      await initAudio();
      const node = new AudioWorkletNode(audioCtx, 'pluck');
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4);
      node.connect(gain);
      gain.connect(audioCtx.destination);
      node.port.postMessage({ freq });
      // Disconnect after note has fully decayed
      setTimeout(() => { try { node.disconnect(); gain.disconnect(); } catch {} }, 4500);
    } catch (err) {
      console.warn('Audio unavailable:', err);
    }
  }

  // ── Build headstock SVG ──────────────────────────────────
  function buildHeadstock() {
    const W = 100, H = SVG_H;
    const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });

    const add = (tag, attrs, text) => {
      const e = svgEl(tag, attrs);
      if (text !== undefined) e.textContent = text;
      svg.appendChild(e);
      return e;
    };

    // Wood fill
    add('rect', { x:0, y:0, width:W, height:H, fill:'#311800' });

    // Headstock body — rounded on the left only
    add('path', {
      d: `M ${W} ${BORDER}
          L 16 ${BORDER}
          Q 2 ${BORDER} 2 ${BORDER + 14}
          L 2 ${H - BORDER - 14}
          Q 2 ${H - BORDER} 16 ${H - BORDER}
          L ${W} ${H - BORDER} Z`,
      fill: '#3a1d00',
      stroke: '#7a6040',
      'stroke-width': 1
    });

    // Top & bottom binding bars (match fretboard border colour)
    add('rect', { x:0, y:0,        width:W, height:BORDER, fill:'#7a6040' });
    add('rect', { x:0, y:H-BORDER, width:W, height:BORDER, fill:'#7a6040' });

    // Per-string: string line + tuning machine assembly
    STRINGS.forEach((str, i) => {
      const cy = pegY(i);

      // String line from right edge to barrel
      add('line', { x1: W, y1: cy, x2: 52, y2: cy,
                    stroke: str.color, 'stroke-width': str.px });

      // Barrel (metal housing)
      add('rect', { x: 42, y: cy - 8, width: 22, height: 16, rx: 3,
                    fill: '#8a8a8a', stroke: '#555', 'stroke-width': 1 });

      // String post hole in barrel
      add('circle', { cx: 53, cy, r: 3.5, fill: '#444' });

      // Tuning knob
      add('circle', { cx: 15, cy, r: 11,
                      fill: '#c2c2c2', stroke: '#888', 'stroke-width': 1.5 });

      // String name on knob
      add('text', { x: 15, y: cy + 4,
                    'text-anchor': 'middle',
                    'font-size': 9,
                    'font-weight': 'bold',
                    'font-family': 'Arial, sans-serif',
                    fill: '#1a1210' }, str.label);
    });

    document.getElementById('headstock').appendChild(svg);
  }

  // ── Build fretboard grid ─────────────────────────────────
  function buildFretboard() {
    const fb = document.getElementById('fretboard');
    document.getElementById('tally-total').textContent = STRINGS.length * (NUM_FRETS + 1);

    // Fret number header
    const hdr = el('div', 'header-row');
    hdr.appendChild(elText('div', 'col-open', 'Open'));
    for (let f = 1; f <= NUM_FRETS; f++) hdr.appendChild(elText('div', 'col-fret', f));
    fb.appendChild(hdr);

    // One row per string
    STRINGS.forEach((str, si) => {
      const row = el('div', 'string-row');
      row.style.setProperty('--str-px',    str.px + 'px');
      row.style.setProperty('--str-color', str.color);
      row.appendChild(makeCell(si, 0, true));                      // open
      for (let f = 1; f <= NUM_FRETS; f++) row.appendChild(makeCell(si, f, false));
      fb.appendChild(row);
    });

    // Fret position marker dots
    const dotRow = el('div', 'marker-row');
    dotRow.appendChild(el('div', 'marker-spacer'));
    for (let f = 1; f <= NUM_FRETS; f++) {
      const mc = el('div', 'marker-cell');
      if      (SINGLE_DOTS.has(f)) mc.appendChild(el('div', 'dot'));
      else if (DOUBLE_DOTS.has(f)) { mc.appendChild(el('div', 'dot')); mc.appendChild(el('div', 'dot')); }
      dotRow.appendChild(mc);
    }
    fb.appendChild(dotRow);

    // Button handlers
    document.getElementById('btn-reset').addEventListener('click', () => {
      document.querySelectorAll('.note-bubble.shown').forEach(b => b.classList.remove('shown'));
      updateTally();
    });
    document.getElementById('btn-showall').addEventListener('click', () => {
      document.querySelectorAll('.note-bubble:not(.shown)').forEach(b => b.classList.add('shown'));
      updateTally();
    });
  }

  buildFretboard();
  buildHeadstock();
</script>
</body>
</html>
